[project]
name = "althea"
version = "0.1.0"
description = "A voice-activated AI desktop assistant for Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "google-adk>=0.1.0",
    "sounddevice>=0.5.5",
    # openwakeword is installed with --no-deps due to tflite-runtime incompatibility
    # with Python 3.14. Its required runtime deps (numpy, onnxruntime, scikit-learn,
    # tqdm, scipy) are listed in [dependency-groups].dev below.
    "openwakeword>=0.6.0",
]

[project.scripts]
althea = "althea.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/althea"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib mode avoids sys.path manipulation, preventing the top-level
# althea.py entry-point from shadowing the src/althea package.
addopts = "--import-mode=importlib"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # openwakeword runtime deps installed manually (see note above)
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "scipy>=1.12.0",
]
